services:
  ai-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-orchestrator:local
    container_name: ai-orchestrator

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      TZ: Asia/Seoul
      OMNI_AI_BASE_URL: "${OMNI_AI_BASE_URL:-http://host.docker.internal:8000}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    mem_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"