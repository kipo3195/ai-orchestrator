spring.application.name=ai-orchestrator
api.version=v1
spring.profiles.active=local

conversation-start.enabled=true
conversation-start.trigger-delay=10s
conversation-start.cooldown=5m
omni-ai.base-url=http://127.0.0.1:8000
omni-ai.returned-message.enabled=false
omni-ai.returned-message.base-url=${omni-ai.base-url}
omni-ai.returned-message.start-path=/ai/v1/returned-message-topics/generate
omni-ai.returned-message.status-path=/ai/v1/returned-message-topics/executions/{executionId}
omni-ai.returned-message.connect-timeout=3s
omni-ai.returned-message.request-timeout=5s

policy.snapshot-refresh-interval=5s
policy.user-cache-ttl=5m
policy.user-negative-cache-ttl=30s
policy.user-fallback-max-concurrency=4

spring.data.redis.timeout=500ms
spring.jdbc.template.query-timeout=2s

returned-message.enabled=true
returned-message.min-away-duration=5m
returned-message.max-absence-duration=7d
returned-message.max-lookback=24h
returned-message.confirmation-timeout=2m
returned-message.expiration-sweep-interval=30s
returned-message.expiration-batch-size=100
returned-message.recovery-claim-duration=30s
returned-message.recovery-sweep-interval=30s
returned-message.recovery-batch-size=100
returned-message.async.execution-pool-size=4
returned-message.async.delivery-pool-size=2
returned-message.async.queue-capacity=100
returned-message.message-query.path=/rest/his_note
returned-message.message-query.connect-timeout=3s
returned-message.message-query.request-timeout=5s
returned-message.message-query.selection-ttl=5m

spring.config.import=classpath:config/result-router.properties
