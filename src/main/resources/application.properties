spring.application.name=ai-orchestrator
api.version=v1
spring.profiles.active=local

conversation-start.enabled=true
conversation-start.trigger-delay=10s
conversation-start.cooldown=5m
omni-ai.base-url=http://127.0.0.1:8000

policy.snapshot-refresh-interval=5s
policy.user-cache-ttl=5m
policy.user-negative-cache-ttl=30s
policy.user-fallback-max-concurrency=4

spring.data.redis.timeout=500ms
spring.jdbc.template.query-timeout=2s

spring.config.import=classpath:config/result-router.properties
